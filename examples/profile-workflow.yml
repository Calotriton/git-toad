# Copy to .github/workflows/toad.yml in your profile repository (github.com/<you>/<you>),
# then add  ![my toad](toad/toad.gif)  to its README.md.
name: toad

on:
  schedule:
    # Hourly, so day and night follow your location. It only commits when the picture
    # changes: at the new day, first light and last light (about 3 commits a day).
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Calotriton/git-toad@main
        with:
          skin: meadow
          output-dir: toad
          latitude: "41.39" # Barcelona; use your own pond's coordinates
          longitude: "2.17"

      - name: Commit the toad
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toad
          git diff --cached --quiet || git commit -m "toad: pond update"
          git push
