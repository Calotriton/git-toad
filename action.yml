name: git-toad
description: Grow a 16-bit pixel-art toad, from frogspawn to old toad, out of your GitHub contributions.
author: git-toad
branding:
  icon: droplet
  color: green

inputs:
  login:
    description: GitHub login whose public activity grows the toad.
    default: ${{ github.repository_owner }}
  skin:
    description: Toad skin (meadow, golden, azure, crimson, violet).
    default: meadow
  output-dir:
    description: Directory that receives toad.gif and toad.png.
    default: toad
  scale:
    description: Pixel scale of the 128x96 scene (4 gives 512x384).
    default: "4"
  latitude:
    description: Latitude of your pond. With longitude, night falls at the real time there (run the workflow hourly).
    default: ""
  longitude:
    description: Longitude of your pond, east positive.
    default: ""
  token:
    description: Token used to read public contribution data.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Grow the toad
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        PYTHONPATH: ${{ github.action_path }}
        TOAD_LOGIN: ${{ inputs.login }}
        TOAD_SKIN: ${{ inputs.skin }}
        TOAD_OUTPUT_DIR: ${{ inputs.output-dir }}
        TOAD_SCALE: ${{ inputs.scale }}
        TOAD_LAT: ${{ inputs.latitude }}
        TOAD_LON: ${{ inputs.longitude }}
      run: |
        place=()
        if [ -n "$TOAD_LAT" ] && [ -n "$TOAD_LON" ]; then place=(--lat "$TOAD_LAT" --lon "$TOAD_LON"); fi
        python3 -m gittoad collect "$TOAD_LOGIN" --output "$RUNNER_TEMP/toad-snapshot.json"
        python3 -m gittoad render "$RUNNER_TEMP/toad-snapshot.json" \
          --output-dir "$TOAD_OUTPUT_DIR" --skin "$TOAD_SKIN" --scale "$TOAD_SCALE" "${place[@]}"
